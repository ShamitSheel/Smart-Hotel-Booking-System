spring.application.name=API-GATEWAY
server.port=${PORT:8000}


eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.enabled=${EUREKA_CLIENT_ENABLED:false}
eureka.client.register-with-eureka=${EUREKA_CLIENT_ENABLED:false}
eureka.client.fetch-registry=${EUREKA_CLIENT_ENABLED:false}

eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
eureka.instance.prefer-ip-address=true

user.service.url=${USER_SERVICE_URL:https://hotelify-user-service.onrender.com}
hotel.service.url=${HOTEL_SERVICE_URL:https://hotelify-hotel-service.onrender.com}
booking.service.url=${BOOKING_SERVICE_URL:https://hotelify-booking-service.onrender.com}
ratings.service.url=${RATINGS_SERVICE_URL:https://hotelify-ratings-service.onrender.com}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://smart-hotel-booking-system.vercel.app,http://localhost:4200}
