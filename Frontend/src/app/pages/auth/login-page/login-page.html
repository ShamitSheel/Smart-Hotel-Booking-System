<div class="flex items-center justify-center min-h-screen bg-gray-100 dark:bg-gray-900 p-4">
    <div class="w-full max-w-2xl bg-white dark:bg-gray-800 rounded-xl shadow-2xl overflow-hidden">
        <div class="md:flex">
            <div class="w-full md:w-3/5 p-8 lg:p-12">
                <h2 class="text-3xl font-bold text-gray-900 dark:text-white mb-2 text-center">
                    Welcome Back !
                </h2>
                <p class="text-sm text-gray-600 dark:text-gray-400 mb-6 text-center">
                    Sign in to your account.
                </p>

                <div class="flex items-center justify-center space-x-4 mb-6 p-1 bg-gray-200 dark:bg-gray-700 rounded-full">
                    <button type="button" 
                            class="py-2 px-6 rounded-full font-semibold transition-colors duration-300"
                            [ngClass]="{'bg-blue-600 text-white shadow-md': role === 'user', 'text-gray-800 dark:text-gray-200': role !== 'user'}"
                            (click)="toggleRole('user')">
                        User Login
                    </button>
                    <button type="button" 
                            class="py-2 px-6 rounded-full font-semibold transition-colors duration-300"
                            [ngClass]="{'bg-blue-600 text-white shadow-md': role === 'admin', 'text-gray-800 dark:text-gray-200': role !== 'admin'}"
                            (click)="toggleRole('admin')">
                        Admin Login
                    </button>
                </div>
                
                <form #loginForm="ngForm" (ngSubmit)="login()">
                    <div class="relative z-0 w-full mb-5 group">
                        <input type="email" name="email" id="email" [(ngModel)]="email" class="block py-2.5 px-0 w-full text-sm text-gray-900 bg-transparent border-0 border-b-2 border-gray-300 appearance-none dark:text-white dark:border-gray-600 dark:focus:border-blue-500 focus:outline-none focus:ring-0 focus:border-blue-600 peer" placeholder=" " required />
                        <label for="email" class="peer-focus:font-medium absolute text-sm text-gray-500 dark:text-gray-400 duration-300 transform -translate-y-6 scale-75 top-3 -z-10 origin-[0] peer-focus:start-0 rtl:peer-focus:translate-x-1/4 peer-focus:text-blue-600 peer-focus:dark:text-blue-500 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-6">Email address</label>
                        <div *ngIf="loginForm.controls['email']?.invalid && loginForm.controls['email']?.touched">
                            <small class="text-red-500">Email is required.</small>
                        </div>
                    </div>

                    <div class="relative z-0 w-full mb-3 group">
                        <input type="password" name="password" id="password" [(ngModel)]="password" class="block py-2.5 px-0 w-full text-sm text-gray-900 bg-transparent border-0 border-b-2 border-gray-300 appearance-none dark:text-white dark:border-gray-600 dark:focus:border-blue-500 focus:outline-none focus:ring-0 focus:border-blue-600 peer" placeholder=" " required />
                        <label for="password" class="peer-focus:font-medium absolute text-sm text-gray-500 dark:text-gray-400 duration-300 transform -translate-y-6 scale-75 top-3 -z-10 origin-[0] peer-focus:start-0 rtl:peer-focus:translate-x-1/4 peer-focus:text-blue-600 peer-focus:dark:text-blue-500 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-6">Password</label>
                        <div *ngIf="loginForm.controls['password']?.invalid && loginForm.controls['password']?.touched">
                            <small class="text-red-500">Password is required.</small>
                        </div>
                    </div>

                    <div class="flex justify-end mb-6">
                        <a (click)="forgotPassword()" class="text-sm font-medium text-blue-600 hover:underline dark:text-blue-500 cursor-pointer">Forgot Password?</a>
                    </div>
                    
                    <button type="submit" class="w-full text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800 transition-transform transform hover:scale-105 disabled:opacity-50 disabled:cursor-not-allowed" [disabled]="!loginForm.form.valid">
                        Log In
                    </button>
                    
                    <div *ngIf="loginError" class="mt-4 text-center text-red-500">
                        <p>{{ loginError }}</p>
                    </div>

                    <p class="text-sm font-light text-gray-500 dark:text-gray-400 mt-4 text-center">
                        Don't have an account? <a routerLink="/register" class="font-medium text-blue-600 hover:underline dark:text-blue-500">Register here</a>
                    </p>
                </form>
            </div>
            
            <div class="hidden md:block md:w-2/5 relative bg-gradient-to-br from-blue-500 to-purple-600">
                <div class="flex items-center justify-center h-full p-4">
                    <div class="text-center text-white">
                        <i class="bi bi-key-fill text-8xl mb-4"></i>
                        <h3 class="text-2xl font-bold">Secure Access.</h3>
                        <p class="text-sm mt-2">
                            Log in to manage your bookings and profile.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
