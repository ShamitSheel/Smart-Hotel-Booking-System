<div class="add-hotel-container">
  <h2>List Your Hotel</h2>
  <div class="stepper-timeline">
    <div *ngFor="let step of steps" 
         class="stepper-step" 
         [ngClass]="{ 'active': currentStep === step.key, 'completed': currentStep > step.key }">
      <div class="stepper-circle">{{ step.key }}</div>
      <div class="stepper-label">{{ step.label }}</div>
      <div class="stepper-line" *ngIf="step.key < steps.length"></div>
    </div>
  </div>

  <app-basic-information 
    *ngIf="currentStep === 1" 
    [initialData]="hotelData"
    (formSubmitted)="onBasicInfoSubmitted($event)">
  </app-basic-information>

  <app-location-contact
    *ngIf="currentStep === 2"
    [initialData]="hotelData"
    (formSubmitted)="onLocationContactSubmitted($event)"
    (goBack)="onGoBack()">
  </app-location-contact>

  <app-photos-media
    *ngIf="currentStep === 3"
    [initialImages]="hotelData.images || []"
    (formSubmitted)="onPhotosMediaSubmitted($event)"
    (goBack)="onGoBack()"
    (imagesUpdated)="onImagesUpdated($event)"> 
  </app-photos-media>

  <app-features-amenities
    *ngIf="currentStep === 4"
    [initialData]="hotelData"
    (formSubmitted)="onFeaturesAmenitiesSubmitted($event)"
    (goBack)="onGoBack()"
    (featuresAmenitiesUpdated)="onFeaturesAmenitiesUpdated($event)"> 
  </app-features-amenities>

  <app-policies
    *ngIf="currentStep === 5"
    [initialData]="hotelData"
    (formSubmitted)="onPoliciesSubmitted($event)"
    (goBack)="onGoBack()"
    (policiesUpdated)="onPoliciesUpdated($event)">
  </app-policies>

  <app-room-details
    *ngIf="currentStep === 6"
    [initialData]="hotelData"
    (formSubmitted)="onRoomDetailsSubmitted($event)"
    (goBack)="onGoBack()"
    (addRoom)="onAddRoom()"
    (editRoom)="onEditRoom($event)"
    (deleteRoom)="onDeleteRoom($event)">
  </app-room-details>

  <div class="modal-overlay" *ngIf="showRoomForm">
    <div class="modal-content">
      <app-room-form
        [roomToEdit]="roomToEdit"
        (formSubmitted)="onRoomFormSubmitted($event)"
        (formCanceled)="onRoomFormCanceled()">
      </app-room-form>
    </div>
  </div>

  <app-review-submit
    *ngIf="currentStep === 7"
    [hotelData]="hotelData"
    (formSubmitted)="onReviewSubmit($event)"
    (goBack)="onGoBack()">
  </app-review-submit>

  </div>
